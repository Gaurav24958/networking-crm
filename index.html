<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Contact</title>
    <style>
      :root {
        --bg: #0f0f10;
        --card: #17171a;
        --border: #2a2a2e;
        --text: #eaeaea;
        --muted: #8a8a8e;
        --accent: #4f7fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
        min-height: 100vh;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 24px;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .sheet-link {
        display: inline-block;
        color: var(--accent);
        font-size: 13px;
        text-decoration: none;
        margin-bottom: 20px;
      }
      .sheet-link:hover {
        text-decoration: underline;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 16px 0 6px;
      }
      input,
      textarea,
      select {
        width: 100%;
        background: #0f0f10;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 11px 12px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }
      textarea {
        resize: vertical;
        min-height: 70px;
      }
      button {
        width: 100%;
        margin-top: 24px;
        padding: 12px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        font-size: 13px;
        text-align: center;
        margin-top: 14px;
        min-height: 16px;
      }
      #status.success {
        color: #4fd17f;
      }
      #status.error {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>New Contact</h1>
      <p class="sub">Log a manager or recruiter you met</p>
      <a
        href="https://docs.google.com/spreadsheets/d/1iCPwguT9MY-hpn5Lu_31U5AaQsE7qo1Vn9AeHzR7Vus/edit"
        target="_blank"
        rel="noopener"
        class="sheet-link"
        >View Google Sheet →</a
      >

      <form id="contactForm">
        <label>Name *</label>
        <input name="Name" required />

        <label>Company</label>
        <input name="Company" />

        <label>Role</label>
        <select name="Role" required>
          <option value="" disabled selected>Select role</option>
          <option>Manager</option>
          <option>Recruiter</option>
        </select>

        <label>Where Met</label>
        <input
          name="Where Met"
          placeholder="e.g. LinkedIn, TCD alumni meetup"
        />

        <label>LinkedIn URL</label>
        <input
          name="LinkedIn URL"
          type="url"
          placeholder="https://linkedin.com/in/..."
        />

        <label>Contact Info</label>
        <input name="Contact Info" placeholder="email / phone" />

        <label>Notes</label>
        <textarea name="Notes"></textarea>

        <label>Follow-up Status</label>
        <select name="Follow-up Status">
          <option>Not Started</option>
          <option>Message Sent</option>
          <option>Responded</option>
          <option>Meeting Scheduled</option>
        </select>

        <button type="submit" id="submitBtn">Save Contact</button>
        <div id="status"></div>
      </form>
    </div>

    <script>
      // Paste your Apps Script Web App URL here (ends in /exec)
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwjWfs4miPL9NqOUhCo55hTNFstRzZ2A2HhMrZz0AMBJWxZyL941S8fiBGrSGLUlwEt/exec";

      const form = document.getElementById("contactForm");
      const btn = document.getElementById("submitBtn");
      const statusEl = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Saving...";
        statusEl.textContent = "";
        statusEl.className = "";

        const data = {};
        new FormData(form).forEach((v, k) => (data[k] = v));

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(data),
            headers: { "Content-Type": "text/plain" },
          });
          const result = await res.json();

          if (result.status === "success") {
            statusEl.textContent = "Saved to sheet ✓";
            statusEl.className = "success";
            form.reset();
          } else {
            throw new Error(result.message || "Unknown error");
          }
        } catch (err) {
          statusEl.textContent = "Failed to save: " + err.message;
          statusEl.className = "error";
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Contact";
        }
      });
    </script>
  </body>
</html>
